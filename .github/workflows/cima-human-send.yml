name: CIMA Human Send Outbox
on:
  push:
    branches: [feat/cima-zernio-human-outbox-20261019]
  pull_request:
    paths:
      - 'app/api/crm/reviews/send/**'
      - 'components/crm/HumanReviewWorkspace*'
      - 'supabase/migrations/20261019_cima_human_send*'
      - 'tests/cima-human-send.test.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/cima-human-send.test.mjs
      - run: node --test tests/cima-human-review-foundation.test.mjs
      - run: npm run build
