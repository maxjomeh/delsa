name: CIMA Knowledge and Grounded Copilot
on:
  push:
    branches: [feat/cima-knowledge-grounded-copilot-20261020]
  pull_request:
    paths:
      - 'app/api/crm/knowledge/**'
      - 'app/api/crm/copilot/**'
      - 'lib/crm/cima-grounding.mjs'
      - 'components/crm/KnowledgeWorkspace*'
      - 'components/crm/HumanReviewWorkspace*'
      - 'supabase/migrations/20261020_cima_knowledge_copilot.sql'
      - 'tests/cima-knowledge-copilot.test.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/cima-knowledge-copilot.test.mjs
      - run: node --test tests/cima-human-send.test.mjs
      - run: node --test tests/cima-human-review-foundation.test.mjs
      - run: npm run build
