name: CIMA / DELSA Channel Hub checks
on:
  push:
    branches:
      - feat/cima-unified-inbox-v1-20261018
      - feat/delsa-channel-hub-instagram-v1
  pull_request:
    paths:
      - 'app/api/channels/**'
      - 'app/api/crm/**'
      - 'components/crm/**'
      - 'lib/crm/**'
      - 'tests/cima-inbox.test.mjs'
      - 'tests/channel-hub.test.mjs'
      - 'supabase/delsa-channel-hub.sql'
      - '.github/workflows/cima-inbox.yml'
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Unit-test CIMA inbox and Channel Hub
        run: node --test tests/cima-inbox.test.mjs tests/channel-hub.test.mjs
      - name: Install packages and build
        run: |
          npm install --no-audit --no-fund
          npm run build
