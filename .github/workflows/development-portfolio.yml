name: Development Portfolio Integrity
on:
  push:
    branches:
      - feat/admin-product-development-progress-20261020
      - feat/devos-*
      - fix/devos-*
  pull_request:
    paths:
      - 'lib/development/**'
      - 'app/api/admin/development/**'
      - 'components/DevelopmentDashboard*'
      - 'components/DevOSBacklog*'
      - 'components/DevOSUnifiedTree*'
      - 'app/api/admin/devos/**'
      - 'lib/devos/**'
      - 'tests/devos-*.test.mjs'
      - 'supabase/migrations/*devos*'
      - 'components/AdminDashboardClient.js'
      - 'tests/development-progress.test.mjs'
      - '.github/workflows/development-portfolio.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate progress invariants and all existing regressions
        run: node --test tests/*.test.mjs
      - name: Build Next.js production bundle
        run: npm run build
