name: SIMA dashboard zoom and scroll visibility
on:
  push:
    branches:
      - fix/sima-dashboard-visibility-20261019
  pull_request:
    paths:
      - components/ScrollReveal.js
      - components/CustomerDashboard.js
      - components/customer-dashboard.css
      - tests/sima-visibility.test.mjs
      - .github/workflows/sima-visibility.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/sima-visibility.test.mjs
      - run: npm run build
