name: SIMA history and adaptive fields
on:
  push:
    branches: [feat/sima-ml-backfill-dynamic-fields-20261019]
  pull_request:
    paths:
      - 'app/api/crm/zernio/history/**'
      - 'app/api/crm/learning/**'
      - 'lib/crm/learning-evidence.mjs'
      - 'components/crm/**'
      - 'supabase/migrations/*learning*'
      - 'supabase/migrations/*history*'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/sima-learning-evidence.test.mjs
      - run: node --test tests/customer-intelligence.test.mjs
      - run: node --test supabase/tests/zernio.test.cjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
