name: SIMA historical inbox and adaptive profiles
on:
  push:
    branches:
      - feat/sima-history-adaptive-profile-20261019
  pull_request:
    paths:
      - 'lib/crm/zernio-history.mjs'
      - 'lib/crm/adaptive-fields.mjs'
      - 'app/api/crm/zernio/history/**'
      - 'app/api/crm/intelligence/**'
      - 'components/crm/HistorySyncPanel*'
      - 'components/crm/CustomerIntelligence*'
      - 'tests/zernio-history-ml.test.mjs'
      - '.github/workflows/sima-history-adaptive.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/zernio-history-ml.test.mjs
      - run: node --test tests/customer-intelligence.test.mjs
      - run: node --test supabase/tests/zernio.test.cjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
