name: SIMA Zernio customer intake verification
on:
  push:
    branches:
      - feat/sima-zernio-customer-ingestion-20261019
  pull_request:
    paths:
      - 'supabase/migrations/*zernio*'
      - 'lib/crm/customer-intelligence.mjs'
      - 'components/crm/CustomerIntelligence*'
      - 'app/api/crm/zernio/webhook/route.js'
      - 'tests/customer-intelligence.test.mjs'
      - '.github/workflows/zernio-customer-ingestion.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/customer-intelligence.test.mjs
      - run: node --test tests/cima-inbox.test.mjs
      - run: node --test supabase/tests/zernio.test.cjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
