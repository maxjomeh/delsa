name: CIMA GapGPT Credentials and Model
on:
  push:
    branches: [feat/cima-gapgpt-admin-credentials-20261020]
  pull_request:
    paths:
      - 'app/api/admin/cima-model/**'
      - 'components/CimaModelAdmin*'
      - 'components/AdminDashboardClient.js'
      - 'lib/crm/cima-gapgpt.mjs'
      - 'app/api/crm/copilot/route.js'
      - 'supabase/migrations/20261020_cima_gapgpt_settings.sql'
      - 'tests/cima-gapgpt-config.test.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/cima-gapgpt-config.test.mjs
      - run: node --test tests/cima-knowledge-copilot.test.mjs
      - run: npm run build
