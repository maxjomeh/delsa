name: SIMA Zernio bridge verification
on:
  push:
    branches:
      - feat/sima-zernio-tenant-bridge-20261019
  pull_request:
    paths:
      - 'lib/crm/zernio.mjs'
      - 'app/api/crm/zernio/**'
      - 'components/crm/ZernioConnection.js'
      - 'supabase/tests/zernio.test.cjs'
      - '.github/workflows/zernio-bridge.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test supabase/tests/zernio.test.cjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
